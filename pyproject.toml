[project]
name = "oia"
version = "0.1.0"
description = "Oracle Impact Analysis - lineage and regression-impact analysis for Oracle databases"
requires-python = ">=3.11"
dependencies = [
    "oracledb>=2.5.0",
    "sqlglot>=25.0.0",
    "networkx>=3.3",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
oia = "oia.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oia"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a real Oracle connection (opt-in, read-only)",
]
testpaths = ["tests"]
addopts = "-m 'not integration'"
